[project]
name = "market-data-challenge-492"
version = "0.1.0"
description = "Suspicious-pattern detection on ETH/BTC trade and orderbook data, calibrated against Kraken and Binance baselines."
requires-python = ">=3.11"
authors = [{ name = "Alex Johnson" }]
readme = "README.md"

dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "python-dateutil>=2.9",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
primer = [
    "markdown>=3.6",
    "pygments>=2.18",
    "weasyprint>=62",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupytext>=1.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/challenge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
